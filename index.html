<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renovatio IT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0e1b2e;
    --navy-deep:#0a1422;
    --slate:#1c2c44;
    --gold:#c39a4d;
    --gold-soft:#d9bd84;
    --paper:#f5f2ea;
    --muted:#8a93a3;
    --line:rgba(195,154,77,.22);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;background:var(--navy);color:var(--paper);
    display:flex;align-items:center;justify-content:center;
    text-align:center;padding:28px;overflow:hidden;position:relative;
    -webkit-font-smoothing:antialiased;
  }
  body::before{content:"";position:absolute;inset:0;
    background:radial-gradient(ellipse 60% 80% at 50% 12%,rgba(195,154,77,.13),transparent 60%);}
  .stage{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
  .mark{width:52px;height:52px;margin-bottom:30px;opacity:0;animation:rise .9s ease .1s forwards}
  .brand{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;
    font-size:clamp(3rem,11vw,6rem);letter-spacing:.02em;line-height:1;
    opacity:0;animation:rise .9s ease .28s forwards}
  .brand .it{color:var(--gold);font-size:.42em;vertical-align:middle;margin-left:6px;letter-spacing:.06em}
  .rule{width:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);
    margin:30px 0;animation:widen 1.1s ease .55s forwards}
  .tag{font-size:.78rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);
    opacity:0;animation:rise .9s ease .7s forwards}
  .lat{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold-soft);
    font-size:1.05rem;margin-top:22px;opacity:0;animation:rise .9s ease .9s forwards}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes widen{from{width:0}to{width:180px}}
</style>
</head>
<body>
  <div class="stage">
    <svg class="mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 3 L20 37 M9 14 L31 14" stroke="#c39a4d" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
    <h1 class="brand">Renovatio<span class="it">IT</span></h1>
    <div class="rule"></div>
    <p class="tag">Coming soon</p>
    <p class="lat">Ecce nova facio omnia</p>
  </div>
</body>
</html>
